name: uptime

# External liveness check for the hosted endpoint (roadmap P0.9). Runs from
# GitHub's network, through Cloudflare, like a real client. A failed run
# emails whoever last changed this schedule. No secrets, no third-party
# actions, and the token has no permissions.
#
# Only runs while the repo is public: on a private repo every run would
# spend Actions minutes (and fail while billing is blocked).
# GitHub disables scheduled workflows in public repos after 60 days without
# repo activity; re-enable it from the Actions tab if that happens.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  healthz:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET https://jdad-mcp.jondevs.com/healthz
        run: |
          body="$(curl -fsS --max-time 15 --retry 2 --retry-delay 20 --retry-all-errors https://jdad-mcp.jondevs.com/healthz)"
          if [ "$body" != '{"status":"ok"}' ]; then
            echo "unexpected body: $body"
            exit 1
          fi
          echo "ok: $body"
