[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jdad"
version = "0.4.0"
description = "JDAD (Jon-does-agentic-dev): knowledge base + MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0,<3",
]

[project.scripts]
jdad = "jdad.cli:main"
jdad-mcp = "jdad.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "skills-ref==0.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# strict, not auto: every async test is @pytest.mark.anyio. In auto mode
# pytest-asyncio also claimed the async `client` fixture, so its teardown ran
# in a different task from its setup ("Attempted to exit cancel scope in a
# different task") on macOS. The anyio plugin now owns the fixture end to end.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["src/jdad"]

[tool.hatch.build.targets.wheel.force-include]
"practices" = "jdad/data/practices"
"sources" = "jdad/data/sources"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/practices",
    "/sources",
    "/tests",
    "/README.md",
    "/CLAUDE.md",
    "/deploy",
    "/commands",
    "/skills",
    "/.claude-plugin",
    "/.mcp.json",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
