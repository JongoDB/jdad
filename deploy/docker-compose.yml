# JDAD on the droplet: the only container, published on port 443 so
# Cloudflare's orange-cloud proxy can reach it with Full (strict) TLS.
# Run as the deploy user from the repo checkout (no passwordless sudo).
#
# Token file (mode 0400, owned by the deploy user): ~/.config/jdad/token,
# mounted as a compose secret at /run/secrets/jdad_token and read once at
# startup through JDAD_TOKEN_FILE, so the value never sits in the container
# environment or `docker inspect`. Env file (mode 0600): ~/.config/jdad/jdad.env,
# which must NOT set JDAD_TOKEN (the server refuses both). Origin cert/key:
# ~/.config/jdad/tls/{origin.crt,origin.key}.
# Build with JDAD_GIT_SHA=$(git rev-parse HEAD).
#
# Don't paste `docker compose config` output anywhere: it expands env_file
# values. (After the token moved to a file it no longer contains the token,
# but keep the habit.)

name: jdad

services:
  jdad:
    image: ${JDAD_IMAGE_REPO:-jdad}:${JDAD_GIT_SHA:-unknown}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        JDAD_GIT_SHA: ${JDAD_GIT_SHA:-unknown}
    user: "${JDAD_UID:-1000}:${JDAD_GID:-1000}"
    command: ["jdad-mcp", "--http", "--host", "0.0.0.0", "--port", "8443"]
    ports:
      # JDAD_PUBLISH lets tests use an ephemeral loopback port ("127.0.0.1:").
      - "${JDAD_PUBLISH:-443}:8443"
    restart: unless-stopped
    env_file:
      - ${HOME}/.config/jdad/jdad.env
    environment:
      JDAD_ALLOWED_HOSTS: jdad-mcp.jondevs.com
      JDAD_SSL_CERTFILE: /tls/origin.crt
      JDAD_SSL_KEYFILE: /tls/origin.key
      JDAD_TOKEN_FILE: /run/secrets/jdad_token
    secrets:
      - jdad_token
    volumes:
      - ${HOME}/.config/jdad/tls:/tls:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import ssl, urllib.request; c=ssl._create_unverified_context(); urllib.request.urlopen('https://127.0.0.1:8443/healthz', context=c, timeout=4).read()",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

secrets:
  jdad_token:
    # Without compose's swarm mode this is a read-only bind mount of the host
    # file, so its owner and mode (deploy uid, 0400) carry into the container.
    file: ${JDAD_TOKEN_FILE_HOST:-${HOME}/.config/jdad/token}
